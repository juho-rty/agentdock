# AgentDock phone relay: a stable workers.dev URL in front of the Mac's
# changing Cloudflare quick tunnel. See README.md.
name = "agentdock-phone"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[vars]
ORIGIN_HOST_SUFFIX = ".trycloudflare.com"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "PhoneRelayRegistry"

# The free plan only offers SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PhoneRelayRegistry"]
