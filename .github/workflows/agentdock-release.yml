name: AgentDock desktop builds

# Push a tag like v0.1.0 to build and publish a GitHub Release with the macOS
# DMG and Windows installer. "Run workflow" builds without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
          - label: Windows x64
            runner: ubuntu-24.04
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(jq -r .version apps/desktop/package.json)" >> "$GITHUB_OUTPUT"
          fi

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp i --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "${{ matrix.rust_target }}"

      - name: Install cargo-xwin
        if: matrix.platform == 'win'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin@0.23.1

      - name: Install Linux packaging tools
        if: matrix.platform == 'win'
        run: sudo apt-get update && sudo apt-get install -y imagemagick pkg-config libsecret-1-dev

      - name: Build resource monitor
        shell: bash
        run: cargo ${{ matrix.platform == 'win' && 'xwin build' || 'build' }} --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ matrix.rust_target }}"

      - name: Build desktop artifact
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
          # The source repo is private, so installed apps check this public
          # repo for updates. scripts/agentdock-publish-release.sh copies each
          # release there.
          T3CODE_DESKTOP_UPDATE_REPOSITORY: juho-rty/agentdock-releases
          # Unsigned: macOS asks users to approve the app once (right-click > Open).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          vp run dist:desktop:artifact \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --build-version "${{ steps.version.outputs.version }}" \
            --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: agentdock-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/*.yml
          if-no-files-found: error
          # The release job republishes these, so old ones only use up the artifact quota.
          retention-days: 2

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      # Optional: with a RELEASES_TOKEN secret (a token that can write to
      # juho-rty/agentdock-releases), CI copies the release there itself.
      # Without it, run scripts/agentdock-publish-release.sh locally.
      - name: Copy release to the public update feed
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        if: env.GH_TOKEN != ''
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            -R juho-rty/agentdock-releases \
            --title "AgentDock ${{ github.ref_name }}" \
            --notes "Installers for AgentDock ${{ github.ref_name }}."
